# 10-sample demo config (extends config.yaml)
physical:
  cn2: 8.13e-15
  l0: 0.0
  l0_sim: 0.01
  L0: 100.0
  L: 1000.0
  rytov_sigma2: 0.35
  Dscope: 0.30
  rspot: 0.075
  wavelength: 800e-9
  focal: 1000.0
  N: 512
  box_size: 0.30
  n_screens: 10
  screen_sep: 100.0
  n_roughness: 2
  roughness_seed: 42
  beam_source: "oopao"
  screen_pool: 0

imaging:
  zR_APWS: null
  f_obj: null
  plane_offset_frac: [0.0, 1.0, 2.0]

bucket:
  diameter_frac: 2.5

data:
  n_train: 8
  n_test: 2
  n_eval: 0
  master_seed: 20250830
  workers: 1
  h5_path: "data/beaconless_demo_10samples.h5"

model:
  name: "CNN1"
  n_modes: 78
  channels: [32, 64, 128]
  kernel: 3
  stride: 1
  padding: 0
  mlp_width: 512
  mlp_depth: 4
  pool_size: 18
  length_head: false
  dropout: 0.0

train:
  optimizer: "adam"
  lr: 1.0e-4
  beta1: 0.9
  beta2: 0.999
  batch_size: 32
  micro_batch_size: 8
  n_steps: 3000
  loss: "mse"
  seed: 0
  amp: true
  mixed_precision: true
  sim_eval_every: 500
  sim_eval_n: 8
  ckpt_dir: "checkpoints"
  log_every: 10
  grad_clip: null

eval:
  bucket_mask_px: null
  out_dir: "results"
  plot_every: 20

wandb:
  project: "beaconless-ao-sim"
  entity: "ywzhang909"
  run_name: null
  tags: ["cnn1", "demo-10"]
  notes: "10-sample validation run of Algorithm 1 (OOPAO+zero-padded Fresnel)."