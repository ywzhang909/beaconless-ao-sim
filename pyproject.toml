[project]
name = "beaconless-ao-sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aotools>=1.0.8",
    "cupy>=14.2.0",
    "h5py>=3.16.0",
    "joblib>=1.5.3",
    "jsonpickle>=4.1.2",
    "matplotlib>=3.11.1",
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "oopao @ git+https://github.com/cheritier/OOPAO.git",
    "pyfftw>=0.15.1",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "soapy>=0.15.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "wandb>=0.29.0",
]

## OOPAO 从 GitHub git 源码安装（与 .venv 实际安装的 commit 8e12a17f 一致）。
## 注意：不要用 [tool.uv.sources] 的 path 指向 third_party ——那里的包根在
## third_party/ 而非 third_party 本身，uv 会解析失败。source 由上方
## "oopao @ git+https://github.com/cheritier/OOPAO.git" 内联指定。

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "nbformat",
    "nbclient",
    "nbconvert"
]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
